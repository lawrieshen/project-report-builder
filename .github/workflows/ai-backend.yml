name: Python AI Backend
on:
  push:
    paths: ['ai-backend/**', 'backend/contracts/ai-compose/**', '.github/workflows/ai-backend.yml']
  pull_request:
    paths: ['ai-backend/**', 'backend/contracts/ai-compose/**', '.github/workflows/ai-backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.6.10
      - name: Install locked dependencies
        working-directory: ai-backend
        run: uv sync --frozen --extra test
      - name: Run offline tests
        working-directory: ai-backend
        run: uv run --frozen --extra test pytest
      - name: Build distribution
        working-directory: ai-backend
        run: uv build
  lambda-package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.6.10
      - name: Package locked Linux arm64 dependencies
        run: python ai-backend/scripts/package_lambda.py
      - name: Smoke test packaged imports in Lambda runtime
        run: |
          mkdir -p /tmp/ai-package
          unzip -q ai-backend/dist/ai-compose-lambda.zip -d /tmp/ai-package
          docker run --rm --network none --entrypoint python \
            -v /tmp/ai-package:/var/task:ro public.ecr.aws/lambda/python:3.12-arm64 \
            -c 'import prb_ai.handler, prb_ai.gemini, prb_ai.secrets, boto3; from google import genai; assert callable(prb_ai.handler.lambda_handler)'
      - uses: actions/upload-artifact@v4
        with:
          name: ai-compose-lambda-arm64
          path: |
            ai-backend/dist/ai-compose-lambda.zip
            ai-backend/dist/ai-compose-lambda.zip.sha256
          if-no-files-found: error
