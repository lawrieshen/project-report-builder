name: Python AI Backend
on:
  push:
    paths: ['ai-backend/**', 'backend/contracts/ai-compose/**', '.github/workflows/ai-backend.yml']
  pull_request:
    paths: ['ai-backend/**', 'backend/contracts/ai-compose/**', '.github/workflows/ai-backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.6.10
      - name: Install locked dependencies
        working-directory: ai-backend
        run: uv sync --frozen --extra test
      - name: Run offline tests
        working-directory: ai-backend
        run: uv run --frozen --extra test pytest
      - name: Build distribution
        working-directory: ai-backend
        run: uv build
