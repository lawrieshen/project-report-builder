[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prb-ai-compose"
version = "0.1.0"
description = "Isolated report composition and budget accounting for Project Report Builder"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
 "boto3>=1.35,<2",
 "google-genai>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
